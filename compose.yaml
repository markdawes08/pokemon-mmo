# Alternative to the project-local Windows PostgreSQL binaries. Do not run both on port 5433.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: pokewaterblue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before using Compose}
      POSTGRES_DB: pokewaterblue
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokewaterblue -d pokewaterblue"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
